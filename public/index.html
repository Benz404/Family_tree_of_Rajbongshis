<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Heritage</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<header><h1>Family Heritage</h1><p>Tap a person to open their children. Tap again to fold them away.</p></header>
<div class="box" id="sbox"><input type="text" id="sq" placeholder="🔍 Search your name to see if you are on the tree" autocomplete="off"><div id="sres"></div></div>
<div class="bar"><button id="addb">➕ Add my branch</button><button class="alt" id="wb">🌍 Where we live</button><button class="alt" id="all">Show everyone</button><button class="alt" id="reset">Start over</button></div>
<div id="wrap"><div id="stage"><svg id="svg"></svg></div></div>
<div id="info" class="box" hidden></div>
<div id="where" class="box" hidden></div>
<div id="add" class="box" hidden>
<div style="font-size:20px;font-weight:700">Add my branch</div>
<p class="nt" style="font-size:16px">Your entry appears on the tree after the family admin has checked it.</p>
<label>What would you like to do?<select id="arel"><option value="child">Add myself as a child of someone</option><option value="spouse">Add myself as a husband or wife of someone</option><option value="parent">Add the parents of someone on the tree</option><option value="claim">This is me, I am already on the tree</option></select></label>
<label><span id="lanc"></span><select id="aanc"></select></label>
<label><span id="lname">Your name</span><input type="text" id="aname"></label>
<label><span id="lpl">Where do you live? City and country only (optional)</span><input type="text" id="aplace" placeholder="e.g. Dibrugarh, India"></label>
<label id="wsp"><span id="lsp">My husband or wife (optional)</span><input type="text" id="aspo"></label>
<label id="wkids">My children, one name per line (optional)<textarea id="akids" rows="3"></textarea></label>
<label>Your phone or email, seen only by the admin (optional)<input type="text" id="acon"></label>
<input type="text" id="aweb" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
<div class="row"><button id="asend">Send for review</button><button class="alt" id="acancel">Close</button></div><div id="amsg"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="tree.js"></script>
<script>
let P=Tree.SEED,ex=new Set(),sel=null,seen=new Set();
const $=id=>document.getElementById(id),by=id=>P.find(p=>p.id===id);
const kids=p=>P.filter(c=>c.par&&(c.par===p.id||c.par===p.sp));
const open=p=>ex.has(p.id)||(!!p.sp&&ex.has(p.sp));
const isRoot=p=>!(p.par&&by(p.par))&&!(p.sp&&by(p.sp)&&by(p.sp).par&&by(by(p.sp).par));
function visible(){
 const v=new Set(P.filter(isRoot).map(p=>p.id));
 for(let ch=true;ch;){ch=false;P.forEach(p=>{
  if(v.has(p.id)&&p.sp&&by(p.sp)&&!v.has(p.sp)){v.add(p.sp);ch=true}
  const q=p.par&&by(p.par);
  if(!v.has(p.id)&&q&&v.has(q.id)&&open(q)){v.add(p.id);ch=true}})}
 return v}
function ensure(id){let q=by(id);
 for(let k=0;k<30&&q;k++){if(!q.par&&q.sp&&by(q.sp)&&by(q.sp).par)q=by(q.sp);
  if(!q.par||!by(q.par))break;q=by(q.par);ex.add(q.id)}}
function draw(anim,fresh){
 const v=visible();seen=v;
 Tree.render($('stage'),$('svg'),P.filter(p=>v.has(p.id)),{anim,fresh,sel,onClick:tap,
  badge:p=>{const n=kids(p).length;return n&&!open(p)?'+'+n:''}});
}
function tap(id){
 const before=visible(),p=by(id);
 if(kids(p).length){if(open(p)){ex.delete(p.id);if(p.sp)ex.delete(p.sp)}else ex.add(p.id)}
 sel=id;go(before);info(p)}
function go(before){
 const fresh=new Set([...visible()].filter(x=>!before.has(x)));
 draw(false,fresh);
 setTimeout(()=>{const c=document.querySelector(`.card[data-id="${sel}"]`);if(c)c.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})},650)}
function reveal(id){const before=visible();ensure(id);const q=by(id);if(q&&q.sp)ensure(q.sp);sel=id;go(before);info(by(id))}
function info(p){
 const b=$('info');b.hidden=false;b.textContent='';
 const av=document.createElement('div');av.className='av';
 if(p.photo){const i=document.createElement('img');i.src=p.photo;i.alt='';av.appendChild(i)}else av.textContent=p.name[0].toUpperCase();
 const h=document.createElement('h2');h.textContent=p.name;b.append(av,h);
 if(p.note){const n=document.createElement('div');n.className='nt';n.textContent=p.note;b.appendChild(n)}
 if(p.place){const n=document.createElement('div');n.className='nt';n.textContent='📍 '+p.place;b.appendChild(n)}
 const par=p.par&&by(p.par),pars=par?[par,par.sp&&by(par.sp)].filter(Boolean):[];
 const sibs=par?P.filter(x=>x.id!==p.id&&x.par&&(x.par===par.id||x.par===par.sp)):[];
 [['Parents',pars],['Spouse',p.sp&&by(p.sp)?[by(p.sp)]:[]],['Children',kids(p)],['Brothers and sisters',sibs]].forEach(([t,l])=>{
  if(!l.length)return;const g=document.createElement('div');g.className='grp';g.textContent=t;
  const c=document.createElement('div');c.className='chips';
  l.forEach(x=>{const k=document.createElement('button');k.className='alt';k.textContent=x.name;k.onclick=()=>reveal(x.id);c.appendChild(k)});
  b.append(g,c)});
 const ac=document.createElement('div');ac.className='row';ac.style.justifyContent='center';
 const me=document.createElement('button');me.className='alt';me.textContent='This is me';me.onclick=()=>openForm('claim',p.id,'');ac.appendChild(me);
 if(!pars.length){const pb=document.createElement('button');pb.className='alt';pb.textContent='Add parents';pb.onclick=()=>openForm('parent',p.id,'');ac.appendChild(pb)}
 b.appendChild(ac)}
function fillAnc(){const o=$('aanc');o.innerHTML='';
 [...P].sort((a,b)=>a.name.localeCompare(b.name)).forEach(x=>{const e=document.createElement('option');e.value=x.id;e.textContent=x.name;o.appendChild(e)})}
function uf(){const r=$('arel').value;
 $('lanc').textContent={child:'You are the child of (already on the tree)',spouse:'You are the husband or wife of (already on the tree)',parent:'You are adding the parent of (already on the tree)',claim:'This is you on the tree'}[r];
 $('lname').textContent=r==='parent'?"Father's or mother's name":'Your name';
 $('lpl').textContent=r==='parent'?'Where did they live? City and country (optional)':'Where do you live? City and country only (optional)';
 $('lsp').textContent=r==='parent'?"The other parent's name (optional)":'My husband or wife (optional)';
 $('wkids').hidden=r==='parent';$('wsp').hidden=r==='spouse'}
function openForm(rel,anc,name){fillAnc();$('arel').value=rel||'child';uf();if(anc)$('aanc').value=anc;if(name!=null)$('aname').value=name;
 $('add').hidden=false;$('add').scrollIntoView({behavior:'smooth'})}
$('arel').onchange=uf;
$('addb').onclick=()=>openForm('child');
$('sq').oninput=()=>{const q=$('sq').value.trim().toLowerCase(),box=$('sres');box.textContent='';if(q.length<2)return;
 const m=P.filter(p=>p.name.toLowerCase().includes(q)).slice(0,8);
 if(!m.length){const d=document.createElement('div');d.className='grp';d.textContent='No one with that name yet. ';
  const b=document.createElement('button');b.textContent='Add my branch';b.onclick=()=>openForm('child',null,$('sq').value);d.appendChild(b);box.appendChild(d);return}
 const c=document.createElement('div');c.className='chips';c.style.marginTop='8px';
 m.forEach(p=>{const b=document.createElement('button');b.className='alt';const q=p.par&&by(p.par);
  b.textContent=p.name+(q?' (child of '+q.name+')':'');b.onclick=()=>{box.textContent='';$('sq').value='';reveal(p.id)};c.appendChild(b)});
 box.appendChild(c)};
$('acancel').onclick=()=>{$('add').hidden=true};
$('asend').onclick=async()=>{
 const m=$('amsg');if(!$('aname').value.trim()){m.textContent='Please enter your name.';return}
 m.textContent='Sending…';
 try{const r=await fetch('/api/tree',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({submit:{place:$('aplace').value,
  name:$('aname').value,rel:$('arel').value,anchor:$('aanc').value,spouse:$('aspo').value,
  children:$('akids').value.split('\n'),contact:$('acon').value,website:$('aweb').value}})});
  if(r.ok){m.textContent='Thank you! Your branch will appear after it has been reviewed.';
   ['aname','aplace','aspo','akids','acon'].forEach(k=>$(k).value='')}
  else m.textContent=(await r.text())||'Could not send. Please try again.'}
 catch(e){m.textContent='Could not reach the server. Please try again.'}};
$('wb').onclick=()=>{const b=$('where');if(!b.hidden){b.hidden=true;return}
 const g={};P.forEach(p=>{const k=(p.place||'').trim();if(!k)return;const key=k.toLowerCase();(g[key]=g[key]||{n:k,l:[]}).l.push(p)});
 b.textContent='';const t=document.createElement('div');t.style.cssText='font-size:20px;font-weight:700;text-align:center';t.textContent='Where our family lives';b.appendChild(t);
 const keys=Object.keys(g).sort((x,y)=>g[y].l.length-g[x].l.length);
 if(!keys.length){const d=document.createElement('div');d.className='grp';d.textContent='No places have been added yet.';b.appendChild(d)}
 keys.forEach(k=>{const d=document.createElement('div');d.className='grp';d.style.textAlign='center';
  d.textContent='📍 '+g[k].n+' — '+g[k].l.length+(g[k].l.length>1?' people':' person');
  const c=document.createElement('div');c.className='chips';
  g[k].l.forEach(p=>{const x=document.createElement('button');x.className='alt';x.textContent=p.name;x.onclick=()=>reveal(p.id);c.appendChild(x)});
  b.append(d,c)});
 b.hidden=false;b.scrollIntoView({behavior:'smooth'})};
$('all').onclick=()=>{const b=visible();P.forEach(p=>ex.add(p.id));go(b)};
$('reset').onclick=()=>{ex=new Set();sel=null;$('info').hidden=true;draw(true)};
fetch('/api/tree').then(r=>r.json()).then(d=>{if(d&&d.people&&d.people.length)P=d.people}).catch(()=>{}).finally(()=>draw(true));
</script></body></html>
