<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rajbongsh Family Heritage</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<header><h1>Rajbongsh Family Heritage</h1><p>Our family, generation by generation</p></header>
<div class="bar"><button id="replay">▶ Replay animation</button></div>
<div id="wrap"><div id="stage"><svg id="svg"></svg></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="tree.js"></script>
<script>
let P=Tree.SEED;
const go=a=>Tree.render(document.getElementById('stage'),document.getElementById('svg'),P,{anim:a});
document.getElementById('replay').onclick=()=>go(true);
fetch('/api/tree').then(r=>r.json()).then(d=>{if(d&&d.people&&d.people.length)P=d.people}).catch(()=>{}).finally(()=>go(true));
</script></body></html>
